name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Show host Python information
        shell: pwsh
        run: |
          python --version
          python -m pip --version

      - name: Create virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe --version
          .\.venv\Scripts\python.exe -m pip --version

      - name: Install project in virtual environment
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Import package
        shell: pwsh
        run: .\.venv\Scripts\python.exe -c "import net_monitor; print(net_monitor.__version__)"

      - name: Verify psutil
        shell: pwsh
        run: .\.venv\Scripts\python.exe -c "import psutil; print(psutil.net_io_counters())"

      - name: Verify PySide6
        shell: pwsh
        run: .\.venv\Scripts\python.exe -c "import PySide6; print(PySide6.__version__)"

      - name: Import ETW module
        shell: pwsh
        run: .\.venv\Scripts\python.exe -c "import net_monitor.collectors.etw; print('ETW import OK')"

      - name: Query Kernel Network ETW provider
        shell: pwsh
        run: |
          $provider = logman query providers "Microsoft-Windows-Kernel-Network" 2>&1
          $provider
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Microsoft-Windows-Kernel-Network provider was not found"
            exit $LASTEXITCODE
          }

      - name: Run tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -v

      - name: Run live ETW loopback probe on PoC branch
        if: github.ref == 'refs/heads/feat/etw-network-poc'
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m net_monitor.collectors.etw.probe

      - name: Verify virtual environment is ignored
        shell: pwsh
        run: |
          if (git status --short -- .venv) {
            Write-Error ".venv must not be tracked or reported as an unignored change"
            exit 1
          }

      - name: Show repository status
        shell: pwsh
        run: git status --short
