name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    name: Full validation ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Show Windows and Python information
        shell: pwsh
        run: |
          python --version
          python -m pip --version
          Write-Output "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Output "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsName, OsVersion, OsArchitecture | Format-List

      - name: Create virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe --version
          .\.venv\Scripts\python.exe -m pip --version

      - name: Install project in virtual environment
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Import package
        shell: pwsh
        run: .\.venv\Scripts\python.exe -c "import net_monitor; print(net_monitor.__version__)"

      - name: Verify psutil
        shell: pwsh
        run: .\.venv\Scripts\python.exe -c "import psutil; print(psutil.net_io_counters())"

      - name: Verify PySide6
        shell: pwsh
        run: .\.venv\Scripts\python.exe -c "import PySide6; print(PySide6.__version__)"

      - name: Import ETW module
        shell: pwsh
        run: .\.venv\Scripts\python.exe -c "import net_monitor.collectors.etw; print('ETW import OK')"

      - name: Query Kernel Network ETW provider
        shell: pwsh
        run: |
          $provider = logman query providers "Microsoft-Windows-Kernel-Network" 2>&1
          $provider
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Microsoft-Windows-Kernel-Network provider was not found"
            exit $LASTEXITCODE
          }

      - name: Show ETW execution identity
        shell: pwsh
        run: |
          whoami
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Output "IsAdministrator=$isAdmin"

      - name: Run complete test suite
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -x -vv

      - name: Verify virtual environment is ignored
        shell: pwsh
        run: |
          if (git status --short -- .venv) {
            Write-Error ".venv must not be tracked or reported as an unignored change"
            exit 1
          }

      - name: Show repository status
        shell: pwsh
        run: git status --short
