name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Show Python information
        shell: pwsh
        run: |
          python --version
          python -m pip --version

      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Import package
        shell: pwsh
        run: python -c "import net_monitor; print(net_monitor.__version__)"

      - name: Verify psutil
        shell: pwsh
        run: python -c "import psutil; print(psutil.net_io_counters())"

      - name: Verify PySide6
        shell: pwsh
        run: python -c "import PySide6; print(PySide6.__version__)"

      - name: Run tests
        shell: pwsh
        run: python -m pytest -v
