[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "net-monitor"
version = "0.2.0"
description = "Windows 11 compact per-application network monitor"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "PySide6",
  "psutil",
]

[project.gui-scripts]
net-monitor = "net_monitor.app:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
